<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Hub</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color-scheme:dark;--bg:#0b0b0f;--panel:#15151b;--panel2:#1d1d25;--border:#2b2b35;--text:#f5f5f7;--muted:#9b9ba6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100dvh}.app{min-height:100dvh;display:flex}.side{width:270px;background:var(--panel);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:18px}.brand{font-size:22px;font-weight:800;display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:11px;background:#f5f5f7;color:#111;display:grid;place-items:center}.new{background:var(--panel2);border:1px solid var(--border);padding:12px;border-radius:13px;text-align:left;color:var(--text)}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.models{display:grid;gap:5px}.model{border:0;background:transparent;color:var(--text);padding:12px;border-radius:11px;text-align:left;display:flex;gap:10px;align-items:center}.model.active,.model:hover{background:var(--panel2)}.dot{width:9px;height:9px;border-radius:50%}.provider{margin-left:auto;color:var(--muted);font-size:10px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.top button{background:transparent;color:var(--text);border:0;font-size:20px;padding:8px}.mobile-model{font-weight:700}.chat{flex:1;overflow:auto;padding:25px max(16px,calc((100% - 900px)/2))}.welcome{max-width:760px;margin:8vh auto 0}.hero{width:56px;height:56px;border-radius:16px;background:#f5f5f7;color:#111;display:grid;place-items:center;font-size:27px;margin-bottom:18px}.welcome h1{font-size:clamp(31px,6vw,50px);letter-spacing:-.04em;margin:0 0 10px}.welcome p{color:var(--muted);font-size:17px;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:25px}.suggest{padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:14px;text-align:left;color:var(--text)}.msg{display:flex;margin:16px 0}.msg.user{justify-content:flex-end}.bubble{max-width:82%;padding:13px 15px;border-radius:17px;white-space:pre-wrap;line-height:1.5;background:var(--panel)}.user .bubble{background:#202027}.meta{font-size:10px;color:var(--muted);margin-bottom:5px}.composer{width:min(900px,calc(100% - 28px));margin:0 auto 8px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:8px;display:flex;gap:8px}.composer textarea{flex:1;border:0;outline:0;background:transparent;color:var(--text);resize:none;padding:10px;max-height:170px}.send{width:42px;height:42px;border:0;border-radius:50%;background:#f5f5f7;color:#111;font-size:23px;align-self:flex-end}.note{text-align:center;color:#62626c;font-size:10px;padding:0 10px 10px}.hidden{display:none}@media(max-width:700px){.side{position:fixed;z-index:20;left:0;top:0;bottom:0;transform:translateX(-105%);transition:.2s;width:285px;box-shadow:20px 0 50px #0008}.side.open{transform:translateX(0)}.cards{grid-template-columns:1fr}.welcome{margin-top:4vh}.bubble{max-width:92%}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
<div class="brand"><div class="logo">✦</div>AI Hub</div>
<button class="new" id="new">＋ Nouvelle conversation</button>
<div class="label">Modèles</div><div class="models" id="models"></div>
<div style="margin-top:auto;color:var(--muted);font-size:11px">AI Hub V0.2 • prototype</div>
</aside>
<main class="main">
<header class="top"><button id="menu">☰</button><div class="mobile-model" id="current"></div><button id="clear">✎</button></header>
<section class="chat" id="chat">
<div class="welcome" id="welcome"><div class="hero">✦</div><h1>Une interface pour tes IA.</h1><p>ChatGPT, Claude, Gemini et Mistral au même endroit. Choisis une IA et commence.</p><div class="cards">
<button class="suggest" data-p="Explique-moi simplement ce sujet.">📚 M'aider à apprendre</button>
<button class="suggest" data-p="Compare plusieurs solutions à ce problème.">⚖️ Comparer</button>
<button class="suggest" data-p="Aide-moi à organiser mes idées.">💡 Organiser</button>
</div></div></section>
<form class="composer" id="form"><textarea id="input" rows="1" placeholder="Message…"></textarea><button class="send">↑</button></form>
<div class="note">Les connexions réelles aux fournisseurs seront ajoutées dans la prochaine version.</div>
</main></div>
<script>
const models=[["chatgpt","ChatGPT","OpenAI","#36d399"],["claude","Claude","Anthropic","#f59e0b"],["gemini","Gemini","Google","#60a5fa"],["mistral","Mistral","Mistral AI","#a78bfa"]];
let selected=localStorage.aihubModel||"chatgpt", messages=JSON.parse(localStorage.aihubMessages||"[]");
const $=x=>document.querySelector(x), chat=$("#chat"), input=$("#input");
function drawModels(){let box=$("#models");box.innerHTML=models.map(m=>`<button class="model ${m[0]==selected?"active":""}" data-id="${m[0]}"><i class="dot" style="background:${m[3]}"></i>${m[1]}<span class="provider">${m[2]}</span></button>`).join("");$("#current").textContent=models.find(m=>m[0]==selected)[1];box.querySelectorAll(".model").forEach(b=>b.onclick=()=>{selected=b.dataset.id;localStorage.aihubModel=selected;drawModels();$("#side").classList.remove("open")})}
function draw(){if(!messages.length){chat.innerHTML="";chat.appendChild($("#welcome"));return}chat.innerHTML="";messages.forEach(m=>{let row=document.createElement("div");row.className="msg "+m.role;let b=document.createElement("div");b.className="bubble";if(m.model){let meta=document.createElement("div");meta.className="meta";meta.textContent=m.model;b.appendChild(meta)}let t=document.createElement("div");t.textContent=m.text;b.appendChild(t);row.appendChild(b);chat.appendChild(row)});chat.scrollTop=chat.scrollHeight}
function send(t){t=t.trim();if(!t)return;let m=models.find(x=>x[0]==selected);messages.push({role:"user",text:t});messages.push({role:"assistant",model:m[1],text:"AI Hub V0.2 est prêt. Cette réponse est encore une démonstration locale : "+m[1]+" n'est pas encore connecté. La prochaine version ajoutera les connexions API autorisées."});localStorage.aihubMessages=JSON.stringify(messages);draw();input.value="";input.style.height="auto"}
$("#form").onsubmit=e=>{e.preventDefault();send(input.value)};input.oninput=()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,170)+"px"};$("#new").onclick=()=>{messages=[];localStorage.aihubMessages="[]";draw()};$("#clear").onclick=()=>{messages=[];localStorage.aihubMessages="[]";draw()};$("#menu").onclick=()=>$("#side").classList.toggle("open");document.querySelectorAll(".suggest").forEach(x=>x.onclick=()=>send(x.dataset.p));drawModels();draw();
</script>
</body></html>
